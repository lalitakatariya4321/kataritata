<svg width="100" height="100" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#0B1020"></rect>

  <!-- Glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <linearGradient id="codeGradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#00F5A0"></stop>
      <stop offset="50%" stop-color="#00D9FF"></stop>
      <stop offset="100%" stop-color="#7F5AF0"></stop>
    </linearGradient>
  </defs>

  <!-- Code Brackets -->
  <path d="M150 150L95 210L150 270" stroke="url(#codeGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>

  <path d="M362 150L417 210L362 270" stroke="url(#codeGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>

  <!-- Slash -->
  <path d="M300 120L212 300" stroke="#00F5A0" stroke-width="14" stroke-linecap="round" filter="url(#glow)"></path>

  <!-- MZ Monogram -->
  <text x="256" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="88" font-weight="700" fill="url(#codeGradient)" filter="url(#glow)">
    MZ
  </text>

  <!-- Fake coding lines -->
  <rect x="110" y="390" width="90" height="8" rx="4" fill="#00F5A0" opacity="0.8"></rect>
  <rect x="220" y="390" width="55" height="8" rx="4" fill="#00D9FF" opacity="0.8"></rect>
  <rect x="290" y="390" width="120" height="8" rx="4" fill="#7F5AF0" opacity="0.8"></rect>

  <rect x="140" y="415" width="70" height="6" rx="3" fill="#7F5AF0" opacity="0.7"></rect>
  <rect x="225" y="415" width="130" height="6" rx="3" fill="#00F5A0" opacity="0.7"></rect>

  <!-- Brand Name -->
  <text x="256" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="600" letter-spacing="4" fill="#E2E8F0">
    &lt;MundaZaiNi/&gt;
  </text>

</svg>